<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Олимпиада: Микробиология</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org"></script>
</head>
<body>

<div class="quiz-container">
    <div class="progress-bar" id="progress">Вопрос 0 из 0</div>
    <div class="question-text" id="question">Загрузка вопросов...</div>
    <div class="options-list" id="options"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Следующий вопрос</button>
</div>

<script>
    // Безопасная инициализация Telegram WebApp
    let tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
        tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    }

    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    // Загрузка базы вопросов с защитой от кэширования
    fetch('./questions.json?v=' + Date.now())
        .then(response => {
            if (!response.ok) {
                throw new Error('Статус ответа: ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            // Очищаем базу от пустых строк
            questions = data.filter(q => q && q.question && q.options && q.options.length > 0);
            
            if (questions.length === 0) {
                document.getElementById('question').innerText = "База вопросов пуста или повреждена.";
                return;
            }
            
            // Перемешиваем случайным образом
            questions.sort(() => Math.random() - 0.5);
            
            // Стартуем квиз
            currentQuestionIndex = 0;
            score = 0;
            showQuestion();
        })
        .catch(err => {
            document.getElementById('question').innerText = "Ошибка загрузки базы: " + err.message;
            console.error(err);
        });

    function showQuestion() {
        document.getElementById('next-btn').style.display = 'none';
        
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options');
        const progressElement = document.getElementById('progress');
        
        optionsContainer.innerHTML = '';
        
        let currentQuestion = questions[currentQuestionIndex];
        progressElement.innerText = `Вопрос ${currentQuestionIndex + 1} из ${questions.length}`;
        questionElement.innerText = currentQuestion.question;
        
        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.addEventListener('click', () => selectOption(index, button));
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedIndex, clickedButton) {
        let currentQuestion = questions[currentQuestionIndex];
        const optionsContainer = document.getElementById('options');
        const buttons = optionsContainer.getElementsByClassName('option-btn');
        
        for (let btn of buttons) {
            btn.disabled = true;
        }
        
        if (selectedIndex === currentQuestion.correct_option_index) {
            clickedButton.classList.add('correct');
            score++;
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } else {
            clickedButton.classList.add('wrong');
            if (currentQuestion.correct_option_index >= 0 && currentQuestion.correct_option_index < buttons.length) {
                buttons[currentQuestion.correct_option_index].classList.add('correct');
            }
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        }
        
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            document.getElementById('question').innerText = `Тест завершен! Результат: ${score} из ${questions.length}`;
            document.getElementById('options').innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';
        }
    }
</script>
</body>
</html>
