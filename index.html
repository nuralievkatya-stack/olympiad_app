<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Олимпиада: Микробиология</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем официальный скрипт Telegram Web App SDK -->
    <script src="https://telegram.org"></script>
</head>
<body>

<div class="quiz-container">
    <div class="progress-bar" id="progress">Вопрос 0 из 0</div>
    <div class="question-text" id="question">Загрузка вопросов...</div>
    <div class="options-list" id="options"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Следующий вопрос</button>
</div>

<script>
    // Инициализируем Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Расширяем мини-приложение на весь экран смартфона

    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    // Загружаем нашу базу данных вопросов
    // Стало:
fetch('./questions.json')
        .then(response => response.json())
        .then(data => {
            // Перемешиваем вопросы случайным образом
            questions = data.sort(() => Math.random() - 0.5);
            startQuiz();
        })
        .catch(err => {
            document.getElementById('question').innerText = "Ошибка загрузки базы данных.";
            console.error(err);
        });

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        showQuestion();
    }

    function showQuestion() {
        const qBtn = document.getElementById('next-btn');
        qBtn.style.display = 'none'; // Скрываем кнопку "Далее" до выбора ответа
        
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options');
        const progressElement = document.getElementById('progress');
        
        optionsContainer.innerHTML = '';
        
        let currentQuestion = questions[currentQuestionIndex];
        progressElement.innerText = `Вопрос ${currentQuestionIndex + 1} из ${questions.length}`;
        questionElement.innerText = currentQuestion.question;
        
        // Создаем кнопки для каждого варианта ответа
        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.addEventListener('click', () => selectOption(index, button));
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedIndex, clickedButton) {
        let currentQuestion = questions[currentQuestionIndex];
        const optionsContainer = document.getElementById('options');
        const buttons = optionsContainer.getElementsByClassName('option-btn');
        
        // Блокируем остальные кнопки после выбора
        for (let btn of buttons) {
            btn.disabled = true;
        }
        
        // Подсвечиваем правильный и неправильный ответы
        if (selectedIndex === currentQuestion.correct_option_index) {
            clickedButton.classList.add('correct');
            score++;
            // Легкая вибрация телефона при успехе (фишка Telegram)
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } else {
            clickedButton.classList.add('wrong');
            // Показываем пользователю, где был правильный ответ
            buttons[currentQuestion.correct_option_index].classList.add('correct');
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        }
        
        // Показываем кнопку перехода к следующему вопросу
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            // Если вопросы кончились
            document.getElementById('question').innerText = `Тест завершен! Ваш результат: ${score} из ${questions.length}`;
            document.getElementById('options').innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';
        }
    }
</script>
</body>
</html>
